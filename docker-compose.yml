services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookingsystem-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

  api:
    build:
      context: .
      dockerfile: BookingSystem.API/Dockerfile

    container_name: bookingsystem-api

    ports:
      - "5068:8080"

    depends_on:
      - sqlserver

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=BookingSystemDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      AdminSeed__Email: "${ADMIN_SEED_EMAIL}"
      AdminSeed__Password: "${ADMIN_SEED_PASSWORD}"

volumes:
  sqlserver-data: