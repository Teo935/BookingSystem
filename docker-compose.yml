services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bookingsystem-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver-data:/var/opt/mssql

    # Verifica che SQL Server accetti davvero connessioni (non solo che il processo sia
    # partito) eseguendo una query di prova con sqlcmd dentro al container stesso.
    # "depends_on: condition: service_healthy" sul servizio "api" aspetta questo esito
    # positivo prima di avviare l'API, riducendo gli errori di connessione transitori
    # nei primi secondi di vita del container SQL Server.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:latest
    container_name: bookingsystem-redis

    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: bookingsystem-rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}"

    ports:
      - "5672:5672"
      - "15672:15672"

  api:
    build:
      context: .
      dockerfile: BookingSystem.API/Dockerfile

    container_name: bookingsystem-api

    ports:
      - "5068:8080"

    # Forma estesa di depends_on: a differenza della semplice lista di nomi (che
    # garantisce solo l'ORDINE di avvio dei container), "condition: service_healthy"
    # aspetta che l'healthcheck di sqlserver dia esito positivo prima di far partire
    # l'api. redis/rabbitmq non hanno un healthcheck definito, quindi per loro vale
    # ancora solo l'ordine di avvio (condition: service_started, il default).
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started

    environment:
      ASPNETCORE_ENVIRONMENT: Development

      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=BookingSystemDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      Jwt__SecretKey: "${JWT_SECRET_KEY}"
      AdminSeed__Email: "${ADMIN_SEED_EMAIL}"
      AdminSeed__Password: "${ADMIN_SEED_PASSWORD}"

volumes:
  sqlserver-data: